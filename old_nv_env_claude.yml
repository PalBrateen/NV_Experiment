# For large environments use libmamba - the fatser solver with parallized downloads
# https://www.anaconda.com/blog/a-faster-conda-for-a-growing-community
# Step 1: run "conda update -n base conda"
# Step 2: download the libmamba solver: "conda install -n base conda-libmamba-solver"
# Step 3: set libmamba as default solver for the base environment "conda config --set solver libmamba"
# Now proceed with install the new environment with this yml file
# install the yml file using "conda env create -f old_nv_env_claude.yml"

# run conda env export --from-history to get the packages that the user installed in the current environment
# Note: to check if a specific version of a package is compatible with the exsiting packages, `conda install numpy=1.0.0 --dry-run`

# To test a new environment for compatibility with several packages use:
# conda create -n test_env1 python>=3.9 python<3.12 numpy scipy scikit-image pyqt pyqtgraph pyvisa nidaqmx-python>=1.0 vitables matplotlib seaborn spyder jupyter jupyterlab ipykernel trackpy pims dask h5py opencv console_shortcut powershell_shortcut --dry-run

# You may run following to force installing from conda-forge as it contains uptodate packages:
# conda config --add channels conda-forge
# conda config --set channel_priority strict

# To temporarily disable channel priority:
# conda config --set channel_priority flexible

# conda install console_shortcut powershell_shortcut -c anaconda
# conda config --set channel_priority strict

# To avoid accidentally using the base use:
# conda config --set auto_activate_base false   # Disable auto-activation of base environment
name: NV_py3.8.8
channels:
  - conda-forge
  - defaults
dependencies:
  # python
  - python>=3.8.8

  # spyder
  - spyder

  # Jupyter
  - ipykernel
  - jupyter
  - jupyterlab
  - jupyterthemes
  #- notebook

  # scientific computing
  - numpy
  - scipy
  - scikit-image
  - matplotlib
  - seaborn
  - vitables
  - trackpy
  - pims
  - h5py
  #- allantools

  # hardware interface
  - pyvisa
  - nidaqmx-python
  - python-decouple   # required by nidaqmx-python
  #- hightime    # this is from pip: pip install hightime
  - tzlocal
  - pylablib

  # GUI and visual
  - pyqt=5.9.2
  - opencv=4.0.1
  
  # Utilities
  - keyboard
  - screeninfo
  - colored

  # test environments using "conda create -n test_env1 python>=3.9 python<3.12 numpy scipy scikit-image pyqt pyqtgraph pyvisa nidaqmx-python>=1.0 vitables matplotlib seaborn spyder jupyter jupyterlab ipykernel trackpy pims dask h5py opencv --dry-run"