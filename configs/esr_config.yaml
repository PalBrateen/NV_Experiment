# ESR Configuration (YAML format)
# Auto-loaded by config_loader.py

experiment:
  name: ESR
  description: Electron Spin Resonance frequency sweep
  sequence: esr_seq
  mode: diode

signal_generator:
  power_dBm: 8
  modulation: pulse
  # Note: frequency is swept, not fixed

pulse_blaster:
  t_AOM_us: 8000      # AOM pulse duration in microseconds
  clk_MHz: 100        # PulseBlaster clock frequency
  channels:
    start: 2
    mw: 4
    laser: 8
    samp: 16

daq:
  Nsamples: 1000         # Number of fluorescence samples per point
  sampling_rate_Hz: 2000000
  voltage_range_V: [-0.2, 0.2]

acquisition:
  Nruns: 30           # Number of averaging runs
  contrast_mode: ratio_signal_over_reference
  randomize: false    # Randomize sweep order

# Sweep configuration
# Order matters: First listed = innermost loop (fastest changing)
sweep:
  - parameter: frequency
    instrument: signal_generator
    start: 2.82e9     # Hz
    stop: 2.92e9      # Hz
    step: 20.0e6       # 1 MHz steps
    units: Hz
    # Total points: (2.92e9 - 2.82e9) / 1e6 + 1 = 101

output:
  save_path: Saved_Data/
  filename_prefix: ESR
  auto_save_interval: 0  # 0 = save only at end

  plot:
    x_label: Frequency (GHz)
    x_scale: 1.0e-9      # Convert Hz to GHz for plotting
    y_label: PL Signal
    live_update: true
